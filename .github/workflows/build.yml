name: Build APK and IPA

on: [push, workflow_dispatch]

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PadLink-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild -project PadLinkHelper.xcodeproj \
            -scheme PadLinkHelper \
            -configuration Release \
            -archivePath build/PadLinkHelper.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        working-directory: ios
        run: bash scripts/package_ipa.sh build/PadLinkHelper.xcarchive

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PadLinkHelper-unsigned-IPA
          path: ios/*.ipa
          if-no-files-found: error
